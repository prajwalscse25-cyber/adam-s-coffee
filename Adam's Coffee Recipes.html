<style>
/* Layout concept: a barista's menu board. Big layered-glass hero, then drink families as colour-keyed tiles,
   then a guided drill-down (family > flavour > drink) that ends in a short, tickable method. */
:root {
  --bg: #EDF1EC;
  --surface: #FAFBF8;
  --surface-2: #E1E9E3;
  --ink: #0E2420;
  --ink-soft: #4B615B;
  --line: #C7D3CC;
  --brand: #0F4A3F;
  --brand-ink: #F4F8F2;
  --accent: #E9A23B;
  --accent-ink: #3A2400;
  --accent-soft: #F6E3C0;
  --focus: #0F4A3F;
  --font-display: "Gloock", "Georgia", serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-script: "Pacifico", "Brush Script MT", cursive;
  --font-mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1916; --surface: #132520; --surface-2: #1B312A; --ink: #E8F1EC; --ink-soft: #9DB5AC;
    --line: #27413A; --brand: #6FD6B8; --brand-ink: #07201A; --accent: #F0B25A; --accent-ink: #2B1A00;
    --accent-soft: #3A2D14; --focus: #6FD6B8; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1916; --surface: #132520; --surface-2: #1B312A; --ink: #E8F1EC; --ink-soft: #9DB5AC;
  --line: #27413A; --brand: #6FD6B8; --brand-ink: #07201A; --accent: #F0B25A; --accent-ink: #2B1A00;
  --accent-soft: #3A2D14; --focus: #6FD6B8; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.wrap { width: 100%; max-width: 1120px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mono { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 12px; }
.brand { display: flex; flex-direction: column; text-decoration: none; line-height: 1.05; margin-right: auto; }
.brand b { font-family: var(--font-script); font-weight: 400; font-size: 1.6rem; letter-spacing: 0; line-height: 1.25; color: var(--brand); }
.brand span { font-family: var(--font-mono); font-size: 0.64rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); }
.search { position: relative; flex: 1 1 260px; max-width: 440px; min-width: 0; }
.search input { width: 100%; font: inherit; padding: 10px 40px 10px 40px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); }
.search input::placeholder { color: var(--ink-soft); }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; stroke: var(--ink-soft); fill: none; stroke-width: 2; pointer-events: none; }
.search .clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; border: 0; border-radius: 50%; background: transparent; color: var(--ink-soft); font-size: 1.1rem; line-height: 1; }
.navlink { text-decoration: none; font-weight: 600; font-size: 0.92rem; padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--line); }
.navlink:hover { background: var(--surface-2); }

main { padding-block: 28px 56px; min-height: 70vh; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; line-height: 1.08; letter-spacing: -0.015em; text-wrap: balance; margin: 0; }
h2 { font-size: clamp(1.7rem, 4.5vw, 2.4rem); }
p { margin: 0; }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr); gap: 24px 40px; align-items: center; padding-block: 12px 36px; }
.hero h1 { font-size: clamp(2.6rem, 8vw, 5.2rem); }
.hero h1 em { font-style: normal; color: var(--brand); }
.hero p.lede { margin-top: 18px; max-width: 46ch; font-size: 1.12rem; color: var(--ink-soft); }
.hero .cta { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 10px; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 999px; font-weight: 700; text-decoration: none; border: 1.5px solid transparent; }
.btn.primary { background: var(--brand); color: var(--brand-ink); }
.btn.ghost { border-color: var(--line); background: var(--surface); }
.btn:hover { filter: brightness(1.06); }
.hero-glass { justify-self: center; width: min(100%, 360px); }
.hero-glass svg { width: 100%; height: auto; display: block; overflow: visible; }
.hero-stats { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 28px; }
.hero-stats span { font-family: var(--font-mono); font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); }
.hero-stats b { color: var(--ink); font-weight: 500; }

.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.sec-head p { color: var(--ink-soft); }

/* tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 14px; }
.tile { --tone: #888; position: relative; display: flex; flex-direction: column; gap: 6px; min-width: 0; padding: 18px 18px 18px 18px; border-radius: var(--radius); text-decoration: none;
  background: color-mix(in srgb, var(--tone) 13%, var(--surface)); border: 1.5px solid color-mix(in srgb, var(--tone) 32%, var(--line)); overflow: hidden; transition: transform .18s ease, border-color .18s ease; }
.tile:hover { transform: translateY(-3px); border-color: var(--tone); }
.tile .g { width: 62px; height: 78px; margin-bottom: 6px; }
.tile .g svg { width: 100%; height: 100%; display: block; }
.tile h3 { font-size: 1.4rem; }
.tile p { color: var(--ink-soft); font-size: 0.92rem; }
.tile .count { margin-top: auto; padding-top: 10px; }

.basics { margin-top: 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 14px; }
.basic { background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.basic b { font-size: 1.02rem; }
.basic span { color: var(--ink-soft); font-size: 0.93rem; }

/* breadcrumbs */
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 22px; font-size: 0.9rem; }
.crumbs a { text-decoration: none; padding: 5px 11px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
.crumbs a:hover { background: var(--surface-2); }
.crumbs i { font-style: normal; color: var(--ink-soft); }
.crumbs .here { padding: 5px 11px; border-radius: 999px; background: var(--brand); color: var(--brand-ink); font-weight: 600; }

.step-head { margin-bottom: 22px; max-width: 60ch; }
.step-head p { margin-top: 8px; color: var(--ink-soft); }
.step-label { margin-bottom: 8px; display: block; }

.choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.choice { --tone: #888; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 4px 16px; align-items: center; padding: 16px 18px; border-radius: var(--radius); text-decoration: none;
  background: var(--surface); border: 1.5px solid var(--line); transition: transform .18s ease, border-color .18s ease; }
.choice:hover { transform: translateY(-2px); border-color: var(--tone); }
.choice .g { grid-row: 1 / span 3; width: 56px; height: 70px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--tone) 15%, var(--surface)); }
.choice .g svg { width: 70%; height: 80%; display: block; }
.choice h3 { font-size: 1.28rem; }
.choice p { color: var(--ink-soft); font-size: 0.92rem; }
.choice .mono { margin-top: 2px; }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding: 0; margin: 14px 0 0; }
.chip { font-family: var(--font-mono); font-size: 0.74rem; letter-spacing: 0.05em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink); white-space: nowrap; }
.chip.cold { background: color-mix(in srgb, #4F9AD6 22%, var(--surface)); }
.chip.hot { background: color-mix(in srgb, #E0762F 22%, var(--surface)); }

/* recipe cards */
.rcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 14px; }
.rcard { --tone: #888; display: flex; flex-direction: column; gap: 4px; padding: 16px 18px; border-radius: var(--radius); background: var(--surface); border: 1.5px solid var(--line); text-decoration: none; min-width: 0; transition: transform .18s ease, border-color .18s ease; }
.rcard:hover { transform: translateY(-2px); border-color: var(--tone); }
.rcard .top-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.rcard .g { width: 34px; height: 42px; flex: none; }
.rcard .g svg { width: 100%; height: 100%; display: block; }
.rcard h3 { font-size: 1.3rem; margin-top: 6px; }
.rcard .chips { margin-top: 8px; }

/* recipe */
.r-head { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 8px 26px; align-items: center; padding-bottom: 26px; border-bottom: 1px solid var(--line); }
.r-head .g svg { width: 100%; height: auto; display: block; }
.r-head h1 { font-size: clamp(2.1rem, 6vw, 3.6rem); margin-top: 6px; }
.r-body { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); gap: 30px 44px; margin-top: 28px; align-items: start; }
.panel { background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 20px 22px; min-width: 0; }
.panel h2 { font-size: 1.6rem; margin-bottom: 14px; }
.ings { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; }
.ing { display: flex; width: 100%; gap: 12px; align-items: flex-start; text-align: left; padding: 9px 4px; border: 0; background: transparent; border-bottom: 1px dashed var(--line); }
.ings li:last-child .ing { border-bottom: 0; }
.box { flex: none; width: 22px; height: 22px; margin-top: 1px; border-radius: 6px; border: 2px solid var(--ink-soft); display: grid; place-items: center; color: transparent; font-size: 0.85rem; font-weight: 700; line-height: 1; }
.ing[aria-pressed="true"] .box, .step-toggle[aria-pressed="true"] .num { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.ing[aria-pressed="true"] span.t { color: var(--ink-soft); text-decoration: line-through; }
.finish { margin-top: 14px; padding: 12px 14px; border-radius: 10px; background: var(--accent-soft); color: var(--ink); font-size: 0.95rem; }
.finish b { font-weight: 700; }
.steps { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; }
.step { display: flex; flex-direction: column; gap: 8px; padding: 14px 14px 14px 12px; border-radius: 12px; background: var(--bg); border: 1.5px solid var(--line); }
.step.has-frother { border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); }
.step-toggle { display: flex; gap: 14px; align-items: flex-start; width: 100%; text-align: left; border: 0; background: transparent; padding: 0; }
.num { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--ink-soft); display: grid; place-items: center; font-family: var(--font-mono); font-weight: 500; font-size: 0.95rem; }
.step-toggle .txt { min-width: 0; padding-top: 4px; font-size: 1.04rem; }
.step-toggle[aria-pressed="true"] .txt { color: var(--ink-soft); text-decoration: line-through; text-decoration-thickness: 1px; }
.step-extra { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-left: 48px; }
.tag { font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 500; }
.timer { padding: 7px 14px; border-radius: 999px; border: 1.5px solid var(--brand); background: transparent; font-weight: 700; font-size: 0.9rem; color: var(--ink); font-variant-numeric: tabular-nums; }
.timer:hover { background: var(--surface-2); }
.timer.running { background: var(--brand); color: var(--brand-ink); }
.timer.done { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.progress { margin-top: 14px; color: var(--ink-soft); font-size: 0.92rem; }
.tip { margin-top: 18px; padding: 16px 18px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface-2); }
.tip b { display: block; margin-bottom: 4px; }
.more { margin-top: 40px; }
.more h2 { font-size: 1.7rem; margin-bottom: 14px; }
.backrow { margin-top: 30px; display: flex; flex-wrap: wrap; gap: 10px; }

/* tips page */
.tips-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 16px; margin-top: 22px; align-items: start; }
.tips-grid .panel ol, .tips-grid .panel ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; }
.tips-grid .panel li b { font-weight: 700; }
.scroll-x { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 440px; font-size: 0.95rem; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); font-weight: 500; }

.empty { padding: 28px; border: 1.5px dashed var(--line); border-radius: var(--radius); color: var(--ink-soft); }
footer { padding-block: 26px 40px; border-top: 1px solid var(--line); color: var(--ink-soft); font-size: 0.88rem; }

@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
.bubbles { animation: bob 3.6s ease-in-out infinite; transform-box: fill-box; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
#app > * { animation: rise .28s ease both; }
@media (prefers-reduced-motion: reduce) { .bubbles, #app > * { animation: none; } .tile, .choice, .rcard { transition: none; } }

@media (max-width: 820px) {
  .hero { grid-template-columns: minmax(0, 1fr); }
  .hero-glass { order: -1; width: min(70%, 240px); }
  .r-body { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 520px) {
  .r-head { grid-template-columns: 84px minmax(0, 1fr); gap: 6px 16px; }
  .step-extra { margin-left: 0; }
  .search { flex-basis: 100%; max-width: none; order: 3; }
  .brand { margin-right: auto; }
}
</style>

    var more = others.length ? '<section class="more"><h2>More from ' + esc(g.label) + '</h2><div class="rcards">' + others.map(function (o) {
      var oc = colourFor(o);
      return '<a class="rcard" href="#recipe-' + o.num + '" style="--tone:' + oc + '"><div class="top-row"><span class="mono">No. ' + pad(o.num) + '</span><div class="g">' + glass(oc) + '</div></div><h3>' + esc(o.name) + '</h3>' + chips(o) + '</a>';
    }).join('') + '</div></section>' : '';
    var finish = r.garnish && r.garnish.toLowerCase() !== 'ice' ? '<p class="finish"><b>Finishing touch:</b> ' + esc(r.garnish) + '</p>' : '';
    return crumbs([{ label: c.label, href: '#cat-' + c.key, link: true }, { label: g.label, href: '#grp-' + c.key + '-' + g.key, link: true }, { label: r.name }]) +
      '<article><header class="r-head"><div class="g">' + glass(col) + '</div><div>' +
      '<p class="mono">Recipe No. ' + pad(r.num) + ' &middot; ' + esc(c.label) + '</p><h1>' + esc(r.name) + '</h1>' +
      '<ul class="chips"><li class="chip ' + (r.cold ? 'cold' : 'hot') + '">' + (r.cold ? 'Cold' : 'Hot') + '</li><li class="chip">' + esc(r.time) + '</li><li class="chip">Makes ' + esc(r.serves) + '</li><li class="chip">Milk: ' + esc(r.base.toLowerCase()) + '</li><li class="chip">Froth: ' + esc(r.froth) + '</li></ul>' +
      '</div></header>' +
      '<div class="r-body"><section class="panel"><h2>You need</h2><ul class="ings">' + ings + '</ul>' + finish + '</section>' +
      '<section class="panel"><h2>Make it</h2><ol class="steps">' + steps + '</ol><p class="progress" id="progress">0 of ' + r.steps.length + ' steps done. Tap a step to tick it off.</p>' +
      '<aside class="tip"><b>Pro tip</b>' + esc(r.tip) + '</aside></section></div>' +
      '<div class="backrow"><a class="btn ghost" href="#grp-' + c.key + '-' + g.key + '">&larr; Back to ' + esc(g.label) + '</a><a class="btn ghost" href="#">Pick another drink</a></div>' +
      more + '</article>';
  }

  function viewTips() {
    return crumbs([{ label: 'Frother tips' }]) +
      '<div class="step-head"><h2>Use your frother like a cafe tool</h2><p>Five habits that make every recipe in the book work better.</p></div>' +
      '<div class="tips-grid">' +
      '<section class="panel"><h2>How to use it</h2><ol>' +
      '<li><b>Start inside the liquid.</b> Put the whisk fully in the milk before switching on. This stops splashing.</li>' +
      '<li><b>Angle it a little.</b> Hold it at a slight angle, near the side of the cup, so the milk circulates smoothly.</li>' +
      '<li><b>Lift slowly for foam.</b> In the last 10 seconds, raise the whisk closer to the surface.</li>' +
      '<li><b>Use a tall glass.</b> A tall glass or jar gives the milk room to rise.</li>' +
      '<li><b>Clean it straight away.</b> Run the whisk in clean water for 5 seconds, then wipe and dry the handle area.</li></ol></section>' +
      '<section class="panel"><h2>If something goes wrong</h2><ul>' +
      '<li><b>Foam is thin.</b> Use colder milk for iced drinks, or warm full-cream milk for hot drinks. Froth near the surface at the end.</li>' +
      '<li><b>Powder lumps.</b> Make a paste first with 1 to 2 tsp liquid, then add the rest of the milk and froth again.</li>' +
      '<li><b>It splashes.</b> Use a taller cup and switch on only after the whisk is inside the liquid.</li>' +
      '<li><b>Foam disappears fast.</b> Add a little cream, use full-cream milk, or froth 10 seconds longer.</li>' +
      '<li><b>Coffee tastes weak.</b> Make the coffee stronger than usual, because milk and foam soften the taste.</li></ul></section>' +
      '</div>' +
      '<section class="panel" style="margin-top:16px"><h2>Which milk to use</h2><div class="scroll-x"><table><thead><tr><th>Milk</th><th>Best for</th><th>Result</th></tr></thead><tbody>' +
      '<tr><td>Full cream milk</td><td>Hot coffee, cappuccino, chocolate</td><td>Thick, stable foam</td></tr>' +
      '<tr><td>Toned milk</td><td>Daily latte, chai, kids drinks</td><td>Light, smooth foam</td></tr>' +
      '<tr><td>Oat milk</td><td>Iced coffee, honey latte</td><td>Creamy texture</td></tr>' +
      '<tr><td>Almond milk</td><td>Nutty latte, protein drinks</td><td>Light foam</td></tr>' +
      '<tr><td>Cold milk</td><td>Cold foam, shakes, iced coffee</td><td>Fast, airy foam</td></tr>' +
      '<tr><td>Warm milk</td><td>Latte, chai, hot chocolate</td><td>Soft cafe foam</td></tr>' +
      '</tbody></table></div><p style="margin-top:14px;color:var(--ink-soft)">Use fine powders, liquid syrups and soft purees. The frother mixes and foams. It does not crush hard ice, nuts or large pieces of fruit.</p></section>' +
      '<div class="backrow"><a class="btn primary" href="#">Choose a drink</a></div>';
  }

  function viewSearch(q) {
    var s = q.trim().toLowerCase(), words = s.split(/\s+/);
    var scored = [];
    RECIPES.forEach(function (r) {
      var name = r.name.toLowerCase(), ing = r.ingredients.join(' ').toLowerCase(), cat = catByKey[r.cat].label.toLowerCase();
      var score = 0, ok = true;
      words.forEach(function (w) {
        if (name.indexOf(w) === 0) score += 6; else if (name.indexOf(w) > -1) score += 4;
        else if (cat.indexOf(w) > -1) score += 2; else if (ing.indexOf(w) > -1) score += 1; else ok = false;
      });
      if (ok) scored.push([score, r]);
    });
    scored.sort(function (a, b) { return b[0] - a[0] || a[1].num - b[1].num; });
    var list = scored.slice(0, 24).map(function (x) { return x[1]; });
    var body = list.length ? '<div class="rcards">' + list.map(function (r) {
      var col = colourFor(r);
      return '<a class="rcard" href="#recipe-' + r.num + '" style="--tone:' + col + '"><div class="top-row"><span class="mono">No. ' + pad(r.num) + '</span><div class="g">' + glass(col) + '</div></div><h3>' + esc(r.name) + '</h3>' + chips(r) + '</a>';
    }).join('') + '</div>' : '<p class="empty">No recipe matches &ldquo;' + esc(q) + '&rdquo;. Try a flavour like caramel, a base like oat, or a drink like latte.</p>';
    return '<div class="step-head"><span class="mono step-label">Search</span><h2>' + plural(scored.length, 'recipe') + ' for &ldquo;' + esc(q) + '&rdquo;</h2></div>' + body;
  }

  /* ---------- timer ---------- */
  var timer = null;
  function stopTimer() { if (timer) { clearInterval(timer.id); timer = null; } }
  function startTimer(btn, sec) {
    if (timer && timer.btn === btn) { // restart
      stopTimer(); btn.className = 'timer'; btn.textContent = 'Start ' + sec + ' s timer'; return;
    }
    stopTimer();
    document.querySelectorAll('.timer').forEach(function (b) { b.className = 'timer'; b.textContent = 'Start ' + b.getAttribute('data-timer') + ' s timer'; });
    var left = sec;
    btn.className = 'timer running'; btn.textContent = 'Frothing: ' + left + ' s (tap to stop)';
    timer = { btn: btn, id: setInterval(function () {
      left -= 1;
      if (left <= 0) { stopTimer(); btn.className = 'timer done'; btn.textContent = 'Done. Switch the frother off'; }
      else { btn.textContent = 'Frothing: ' + left + ' s (tap to stop)'; }
    }, 1000) };
  }

  /* ---------- router ---------- */
  var app = document.getElementById('app');
  var qIn = document.getElementById('q'), qClear = document.getElementById('qclear');

  function render() {
    stopTimer();
    var q = qIn.value;
    qClear.hidden = !q;
    if (q.trim().length >= 1) { app.innerHTML = viewSearch(q); return; }
    var h = (location.hash || '').replace(/^#/, '');
    if (!h) { app.innerHTML = viewHome(); return; }
    if (h === 'tips') { app.innerHTML = viewTips(); return; }
    var m = /^recipe-(\d{1,3})$/.exec(h);
    if (m && byNum[+m[1]]) { app.innerHTML = viewRecipe(byNum[+m[1]]); return; }
    var rt = routes[h];
    if (rt && rt.v === 'cat') { app.innerHTML = viewCat(rt.cat); return; }
    if (rt && rt.v === 'grp') { app.innerHTML = viewGroup(rt.cat, rt.group); return; }
    app.innerHTML = viewHome();
  }

  window.addEventListener('hashchange', function () { qIn.value = ''; render(); window.scrollTo(0, 0); });
  qIn.addEventListener('input', function () { render(); });
  qClear.addEventListener('click', function () { qIn.value = ''; render(); qIn.focus(); });
  qIn.addEventListener('keydown', function (e) { if (e.key === 'Escape') { qIn.value = ''; render(); } });

  app.addEventListener('click', function (e) {
    var t = e.target.closest('[data-timer]');
    if (t) { startTimer(t, parseInt(t.getAttribute('data-timer'), 10)); return; }
    var b = e.target.closest('[data-toggle]');
    if (b) {
      b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
      var total = app.querySelectorAll('.step-toggle').length, done = app.querySelectorAll('.step-toggle[aria-pressed="true"]').length;
      var p = document.getElementById('progress');
      if (p) p.textContent = done === total ? 'All steps done. Enjoy your drink!' : done + ' of ' + total + ' steps done. Tap a step to tick it off.';
    }
  });

  render();
})();
</script>

</body></html>
